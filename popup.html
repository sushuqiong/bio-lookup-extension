<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>生信快查 · 查询历史</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand">
      <span class="logo">🧬</span>
      <div>
        <strong>生信快查</strong>
        <span class="sub">Bio Lookup · v0.2</span>
      </div>
    </div>
    <div class="head-right">
      <span class="count" id="count">0</span>
      <button class="icon-btn" id="openOptions" title="设置（自定义数据库 / 页面浮层）">⚙️</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab is-active" data-tab="history">🕘 查询历史</button>
    <button class="tab" data-tab="batch">📚 批量查询</button>
  </nav>

  <section id="pane-history">
  <section class="query-box">
    <div class="query-row">
      <input id="q" type="text" placeholder="输入基因 / rsID / GEO / 坐标 / PMID…" autocomplete="off" spellcheck="false">
      <button id="go" class="btn primary">查询</button>
    </div>
    <p class="hint" id="hint">自动识别类型 · 未识别时走通用检索</p>
    <div class="db-row" id="dbRow"></div>
  </section>

  <section class="toolbar">
    <input id="filter" type="search" placeholder="筛选历史…" autocomplete="off">
    <select id="typeFilter" aria-label="类型筛选">
      <option value="">全部类型</option>
      <option value="gene">🧬 基因</option>
      <option value="variant_rs">🔎 SNP</option>
      <option value="variant_hgvs">🧪 变异 HGVS</option>
      <option value="variant_coord">🌍 变异坐标</option>
      <option value="geo">📦 GEO</option>
      <option value="pmid">📚 文献</option>
      <option value="doi">🔖 DOI</option>
      <option value="region">🗺️ 区间</option>
      <option value="sequence">🚀 序列</option>
      <option value="unknown">🔍 通用</option>
    </select>
  </section>

  <ul class="list" id="list"></ul>
  <p class="empty" id="empty">还没有查询记录。<br>在任意网页选中基因名 / rsID / GEO 编号，右键试试。</p>

  <footer class="foot">
    <button id="export" class="btn">⬇️ 导出 CSV</button>
    <button id="clear" class="btn danger">🗑️ 清空历史</button>
  </footer>
  </section>

  <section id="pane-batch" hidden>
    <div class="batch-box">
      <p class="batch-tip">每行一条（也支持逗号/分号分隔），最多 20 条。适合把论文里的基因列表、变异清单一次性查完。</p>
      <textarea id="batchInput" rows="6" placeholder="TP53&#10;BRCA1&#10;rs80357906&#10;GSE123456&#10;chr17:7676154 C>T"></textarea>
      <div class="batch-mode">
        <label><input type="radio" name="bmode" value="auto" checked> 各自动类型 · 首选库</label>
        <select id="batchDb" aria-label="指定数据库">
          <option value="">或指定统一数据库…</option>
        </select>
      </div>
      <div class="batch-preview" id="batchPreview"></div>
      <button class="btn primary" id="runBatch" style="width:100%; margin-top:10px;">🚀 批量打开（后台标签）</button>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
