name: 💡 功能建议 / Feature request
description: 希望新增或改进什么功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题 / What problem are you facing?
      description: 描述你的使用场景，比直接说"想要某某功能"更有帮助
      placeholder: |
        例如：我读论文时想把页面里所有基因名一次性查完，现在必须一个个选中……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的解决方式 / Proposed solution
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案 / Alternatives you tried
    validations:
      required: false
